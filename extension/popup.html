<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unitify Bridge</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><strong>Unitify Bridge</strong><label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="Синхронизация включена"><span></span></label></header>
  <p id="status" role="status">Подключение…</p><small id="timestamps"></small>
  <form id="pair" hidden><label for="code">Код из /extension в Telegram</label><div class="inline"><input id="code" maxlength="9" placeholder="ABCD-EFGH" autocomplete="off" required><button>Связать</button></div></form>
  <p id="notice" hidden></p>
  <footer><button id="sync">Обновить</button><button id="preferences" class="quiet" aria-expanded="false">Настройки</button></footer>
  <section id="options" hidden><button class="quiet" id="diagnostics">Скачать диагностику</button><button class="quiet" id="unpair" hidden>Отключить Telegram</button><button class="quiet" id="clear">Очистить локальные данные</button></section>
</main><script type="module" src="popup.js"></script></body></html>
